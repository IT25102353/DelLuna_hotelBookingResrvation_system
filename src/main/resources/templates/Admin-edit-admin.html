<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Edit Admin</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="flex items-center justify-center min-h-screen bg-gray-100">
<div class="bg-white p-8 rounded-lg shadow-md w-full max-w-sm">
    <h2 class="text-2xl font-bold mb-6 text-center">Edit Admin Account</h2>
    <form th:action="@{/admin/admin/update/{id}(id=${admin.id})}" method="post" class="flex flex-col gap-4">
        <div>
            <label class="block mb-1 font-medium">Username</label>
            <input type="text" name="username" th:value="${admin.username}" required class="w-full border px-3 py-2 rounded focus:outline-none focus:ring-2 focus:ring-gray-400"/>
        </div>
        <div>
            <label class="block mb-1 font-medium">New Password</label>
            <input type="password" name="password" th:value="${admin.password}" required class="w-full border px-3 py-2 rounded focus:outline-none focus:ring-2 focus:ring-gray-400"/>
        </div>
        <div class="flex gap-3 mt-2">
            <a th:href="@{/admin/admin}" class="w-1/2 text-center border border-gray-300 hover:bg-gray-100 py-2 rounded font-medium">← Cancel</a>
            <button type="submit" class="w-1/2 bg-gray-700 hover:bg-gray-800 text-white py-2 rounded font-semibold">Save Changes</button>
        </div>
    </form>
</div>
</body>
</html>
