<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Edit Room</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="flex items-center justify-center min-h-screen bg-gray-100">
<div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
    <h2 class="text-2xl font-bold mb-6 text-center">Edit Room</h2>
    <div th:if="${error}" class="bg-red-100 text-red-700 px-4 py-2 rounded mb-4" th:text="${error}"></div>
    <form th:action="@{/admin/room/update/{id}(id=${room.id})}" method="post" enctype="multipart/form-data" class="flex flex-col gap-4">
        <div>
            <label class="block mb-1 font-medium">Room Type</label>
            <input type="text" name="type" th:value="${room.type}" required class="w-full border px-3 py-2 rounded focus:outline-none focus:ring-2 focus:ring-indigo-400"/>
        </div>
        <div>
            <label class="block mb-1 font-medium">Original Price ($)</label>
            <input type="number" step="0.01" name="price" th:value="${room.price}" required class="w-full border px-3 py-2 rounded focus:outline-none focus:ring-2 focus:ring-indigo-400"/>
        </div>
        <div>
            <label class="block mb-1 font-medium">Discount (%)</label>
            <input type="number" step="0.01" min="0" max="100" name="discountPercent" th:value="${room.discountPercent}" class="w-full border px-3 py-2 rounded focus:outline-none focus:ring-2 focus:ring-indigo-400"/>
        </div>
        <div>
            <label class="block mb-1 font-medium">Package</label>
            <select name="packageId" required class="w-full border px-3 py-2 rounded focus:outline-none focus:ring-2 focus:ring-indigo-400">
                <option th:each="pkg : ${packages}" th:value="${pkg.id}" th:text="${pkg.name}" th:selected="${room.pkg != null and room.pkg.id == pkg.id}"></option>
            </select>
        </div>
        <div th:if="${room.imageUrl}">
            <label class="block mb-1 font-medium">Current Image</label>
            <img th:src="@{${room.imageUrl}}" alt="Room image" class="h-24 w-36 rounded object-cover"/>
        </div>
        <div>
            <label class="block mb-1 font-medium">Replace Image</label>
            <input type="file" name="image" accept="image/*" class="w-full border px-3 py-2 rounded focus:outline-none focus:ring-2 focus:ring-indigo-400"/>
        </div>
        <div class="flex gap-3 mt-2">
            <a th:href="@{/admin/room}" class="w-1/2 text-center border border-gray-300 hover:bg-gray-100 py-2 rounded font-medium">← Cancel</a>
            <button type="submit" class="w-1/2 bg-indigo-500 hover:bg-indigo-600 text-white py-2 rounded font-semibold">Save Changes</button>
        </div>
    </form>
</div>
</body>
</html>
