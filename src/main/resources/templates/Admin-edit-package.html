<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Edit Package</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="flex items-center justify-center min-h-screen bg-gray-100">
<div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
    <h2 class="text-2xl font-bold mb-6 text-center">Edit Package</h2>
    <div th:if="${error}" class="bg-red-100 text-red-700 px-4 py-2 rounded mb-4" th:text="${error}"></div>
    <form th:action="@{/admin/packages/update/{id}(id=${pkg.id})}" method="post" enctype="multipart/form-data" class="flex flex-col gap-4">
        <div>
            <label class="block mb-1 font-medium">Package Name</label>
            <input type="text" name="name" th:value="${pkg.name}" required class="w-full border px-3 py-2 rounded focus:outline-none focus:ring-2 focus:ring-purple-400"/>
        </div>
        <div>
            <label class="block mb-1 font-medium">Original Price ($)</label>
            <input type="number" step="0.01" name="price" th:value="${pkg.price}" required class="w-full border px-3 py-2 rounded focus:outline-none focus:ring-2 focus:ring-purple-400"/>
        </div>
        <div>
            <label class="block mb-1 font-medium">Discount (%)</label>
            <input type="number" step="0.01" min="0" max="100" name="discountPercent" th:value="${pkg.discountPercent}" class="w-full border px-3 py-2 rounded focus:outline-none focus:ring-2 focus:ring-purple-400"/>
        </div>
        <div>
            <label class="block mb-1 font-medium">Description</label>
            <input type="text" name="description" th:value="${pkg.description}" required class="w-full border px-3 py-2 rounded focus:outline-none focus:ring-2 focus:ring-purple-400"/>
        </div>
        <div th:if="${pkg.imageUrl}">
            <label class="block mb-1 font-medium">Current Image</label>
            <img th:src="@{${pkg.imageUrl}}" alt="Package image" class="h-24 w-36 rounded object-cover"/>
        </div>
        <div>
            <label class="block mb-1 font-medium">Replace Image</label>
            <input type="file" name="image" accept="image/*" class="w-full border px-3 py-2 rounded focus:outline-none focus:ring-2 focus:ring-purple-400"/>
        </div>
        <div class="flex gap-3 mt-2">
            <a th:href="@{/admin/packages}" class="w-1/2 text-center border border-gray-300 hover:bg-gray-100 py-2 rounded font-medium">← Cancel</a>
            <button type="submit" class="w-1/2 bg-purple-500 hover:bg-purple-600 text-white py-2 rounded font-semibold">Save Changes</button>
        </div>
    </form>
</div>
</body>
</html>
