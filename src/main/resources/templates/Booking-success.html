<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Confirmed</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" th:href="@{/css/hotel-ui.css}">
</head>
<body class="hotel-bg">
<main class="page-shell flex items-center justify-center">
    <section class="glass-panel w-full max-w-lg rounded-2xl p-8 text-center">
        <div class="mx-auto mb-5 flex h-16 w-16 items-center justify-center rounded-full bg-emerald-100 text-3xl font-extrabold text-emerald-700">OK</div>
        <h1 class="text-3xl font-extrabold text-slate-900">Booking Confirmed</h1>
        <div th:if="${error}" class="mt-5 rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm font-semibold text-red-700" th:text="${error}"></div>
        <p class="mt-3 leading-7 text-slate-600">Your payment was completed and your room has been booked.</p>
        <p th:if="${booking}" class="mt-4 rounded-xl bg-white/80 px-4 py-3 text-sm font-bold text-slate-600" th:text="${'Booking #' + booking.id + ' - ' + booking.paymentStatus}"></p>
        <a th:href="@{/}" class="primary-btn mt-6 w-full">Back to Home</a>
    </section>
</main>
</body>
</html>
