<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book a Room</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" th:href="@{/css/hotel-ui.css}">
</head>
<body class="hotel-bg">
<main class="page-shell flex items-center justify-center">
    <section class="grid w-full max-w-5xl gap-6 lg:grid-cols-[0.85fr_1.15fr]">
        <aside class="glass-panel rounded-2xl p-6">
            <span class="step-pill">Selected Package</span>
            <div class="mt-5">
                <div class="flex items-start justify-between gap-3">
                    <h1 class="text-3xl font-extrabold text-slate-900" th:text="${selectedPackage.name}"></h1>
                    <span th:if="${selectedPackage.discountPercent > 0}"
                          class="rounded-full bg-rose-100 px-3 py-1 text-xs font-extrabold text-rose-700"
                          th:text="${selectedPackage.discountPercent} + '% OFF'"></span>
                </div>
                <p class="mt-3 leading-7 text-slate-600" th:text="${selectedPackage.description}"></p>
                <div class="mt-5 flex items-end gap-3">
                    <span th:if="${selectedPackage.discountPercent > 0}"
                          class="pb-1 text-sm font-semibold text-slate-400 line-through"
                          th:text="'$' + ${#numbers.formatDecimal(selectedPackage.price,1,2)}"></span>
                    <span class="text-4xl font-extrabold text-blue-700"
                          th:text="'$' + ${#numbers.formatDecimal(selectedPackage.discountedPrice,1,2)}"></span>
                </div>
            </div>
            <div class="mt-6 rounded-xl bg-white/80 p-4">
                <p class="text-xs font-bold uppercase tracking-wide text-slate-400">Logged in customer</p>
                <p class="mt-1 font-extrabold text-slate-900" th:text="${session.customerName}"></p>
            </div>
        </aside>

        <section class="soft-card rounded-2xl p-5 sm:p-8">
            <div class="mb-6">
                <span class="step-pill">Step 2 of 2</span>
                <h2 class="mt-3 text-3xl font-extrabold text-slate-900">Booking Details</h2>
                <p class="mt-2 text-slate-500">Pick your dates and room to continue to payment.</p>
            </div>

            <div th:if="${error}" class="mb-5 rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm font-semibold text-red-700" th:text="${error}"></div>

            <form th:action="@{/bookings/save}" th:object="${booking}" method="post" class="space-y-5">
                <input type="hidden" name="packageId" th:value="${selectedPackage.id}">

                <div class="grid gap-4 sm:grid-cols-2">
                    <div>
                        <label class="mb-2 block text-sm font-bold text-slate-700">Check-in Date</label>
                        <input type="date" th:field="*{checkInDate}" required class="field w-full bg-white">
                    </div>

                    <div>
                        <label class="mb-2 block text-sm font-bold text-slate-700">Check-out Date</label>
                        <input type="date" th:field="*{checkOutDate}" required class="field w-full bg-white">
                    </div>
                </div>

                <div>
                    <label class="mb-2 block text-sm font-bold text-slate-700">Select Room</label>
                    <select name="roomId" required class="field w-full bg-white">
                        <option value="">Select a Room</option>
                        <option th:each="room : ${rooms}"
                                th:value="${room.id}"
                                th:text="${room.type}
                                        + ' - '
                                        + (${room.discountPercent} > 0
                                            ? '$' + ${#numbers.formatDecimal(room.discountedPrice,1,2)} + ' (' + ${room.discountPercent} + '% off)'
                                            : '$' + ${#numbers.formatDecimal(room.price,1,2)})">
                        </option>
                    </select>
                    <p th:if="${#lists.isEmpty(rooms)}" class="mt-2 text-sm font-semibold text-red-500">
                        No rooms available for this package.
                    </p>
                </div>

                <div th:if="${!#lists.isEmpty(rooms)}" class="grid grid-cols-1 gap-3 sm:grid-cols-2">
                    <div th:each="room : ${rooms}" th:if="${room.imageUrl}" class="flex items-center gap-3 rounded-xl border border-slate-200 bg-slate-50 p-3">
                        <img th:src="@{${room.imageUrl}}" alt="Room image" class="h-20 w-28 rounded-lg object-cover">
                        <div class="min-w-0">
                            <p class="truncate font-bold text-slate-800" th:text="${room.type}"></p>
                            <p class="text-xs text-slate-500">Available room</p>
                        </div>
                    </div>
                </div>

                <div class="flex flex-col gap-3 pt-2 sm:flex-row">
                    <a th:href="@{/bookings/new}" class="secondary-btn flex-1">Back</a>
                    <button type="submit" class="primary-btn flex-1">Continue to Payment</button>
                </div>
            </form>
        </section>
    </section>
</main>
</body>
</html>
