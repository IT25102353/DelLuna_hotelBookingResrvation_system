<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" th:href="@{/css/hotel-ui.css}">
</head>
<body class="hotel-bg">
<main class="page-shell flex items-center justify-center">
    <section class="glass-panel w-full max-w-md rounded-2xl p-6 sm:p-8">
        <div class="mb-6 text-center">
            <span class="step-pill">Admin portal</span>
            <h1 class="mt-3 text-3xl font-extrabold text-slate-900">Hotel Admin</h1>
            <p class="mt-2 text-slate-500">Sign in to manage bookings, rooms, packages, and reviews.</p>
        </div>
        <div th:if="${error}" class="mb-5 rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm font-semibold text-red-700" th:text="${error}"></div>
        <form th:action="@{/login}" method="post" class="space-y-4">
            <div>
                <label class="mb-2 block text-sm font-bold text-slate-700">Username</label>
                <input type="text" name="username" required class="field w-full bg-white">
            </div>
            <div>
                <label class="mb-2 block text-sm font-bold text-slate-700">Password</label>
                <input type="password" name="password" required class="field w-full bg-white">
            </div>
            <button type="submit" class="primary-btn w-full">Login</button>
        </form>
        <div class="mt-5 text-center">
            <a th:href="@{/}" class="text-sm font-semibold text-slate-500 hover:text-slate-800">Back to Home</a>
        </div>
    </section>
</main>
</body>
</html>
