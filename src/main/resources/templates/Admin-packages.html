<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Manage Packages</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-gray-100 min-h-screen p-6">
<div class="max-w-6xl mx-auto">

    <div class="flex items-center justify-between mb-6">
        <h1 class="text-2xl font-bold text-gray-800">📦 Package Management</h1>
        <a th:href="@{/admin/dashboard}"><button class="border border-gray-400 hover:bg-gray-200 px-4 py-2 rounded text-sm">← Dashboard</button></a>
    </div>

    <!-- Add Package Form -->
    <div class="bg-white rounded-lg shadow p-6 mb-8">
        <h2 class="text-lg font-bold mb-4 text-purple-700">Add New Package</h2>
        <div th:if="${error}" class="bg-red-100 text-red-700 px-4 py-2 rounded mb-4" th:text="${error}"></div>
        <form th:action="@{/admin/packages/save}" th:object="${newPackage}" method="post" enctype="multipart/form-data" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block mb-1 font-medium text-sm">Package Name</label>
                <input type="text" th:field="*{name}" required class="w-full border px-3 py-2 rounded focus:outline-none focus:ring-2 focus:ring-purple-400" placeholder="e.g. Deluxe"/>
            </div>
            <div>
                <label class="block mb-1 font-medium text-sm">Original Price ($)</label>
                <input type="number" step="0.01" th:field="*{price}" required class="w-full border px-3 py-2 rounded focus:outline-none focus:ring-2 focus:ring-purple-400" placeholder="e.g. 300.00"/>
            </div>
            <div>
                <label class="block mb-1 font-medium text-sm">Discount (%)</label>
                <input type="number" step="0.01" min="0" max="100" th:field="*{discountPercent}" class="w-full border px-3 py-2 rounded focus:outline-none focus:ring-2 focus:ring-purple-400" placeholder="e.g. 10"/>
            </div>
            <div>
                <label class="block mb-1 font-medium text-sm">Description</label>
                <input type="text" th:field="*{description}" required class="w-full border px-3 py-2 rounded focus:outline-none focus:ring-2 focus:ring-purple-400" placeholder="Short description"/>
            </div>
            <div class="md:col-span-2">
                <label class="block mb-1 font-medium text-sm">Package Image</label>
                <input type="file" name="image" accept="image/*" class="w-full border px-3 py-2 rounded focus:outline-none focus:ring-2 focus:ring-purple-400"/>
            </div>
            <div class="md:col-span-2">
                <button type="submit" class="bg-purple-500 hover:bg-purple-600 text-white px-6 py-2 rounded font-semibold">+ Add Package</button>
            </div>
        </form>
    </div>

    <!-- Packages Table -->
    <div class="bg-white rounded-lg shadow p-6">
        <h2 class="text-lg font-bold mb-4 text-gray-700">All Packages</h2>
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse text-sm">
                <thead><tr class="bg-purple-50">
                    <th class="p-3 border">#</th>
                    <th class="p-3 border">Image</th>
                    <th class="p-3 border">Name</th>
                    <th class="p-3 border">Original Price</th>
                    <th class="p-3 border">Discount %</th>
                    <th class="p-3 border">Final Price</th>
                    <th class="p-3 border">Description</th>
                    <th class="p-3 border">Actions</th>
                </tr></thead>
                <tbody>
                <tr th:each="pkg : ${packages}" class="hover:bg-gray-50">
                    <td class="p-3 border" th:text="${pkg.id}"></td>
                    <td class="p-3 border">
                        <img th:if="${pkg.imageUrl}" th:src="@{${pkg.imageUrl}}" alt="Package image" class="h-14 w-20 rounded object-cover"/>
                        <span th:unless="${pkg.imageUrl}" class="text-gray-400">No image</span>
                    </td>
                    <td class="p-3 border font-medium" th:text="${pkg.name}"></td>
                    <td class="p-3 border" th:text="'$' + ${#numbers.formatDecimal(pkg.price,1,2)}"></td>
                    <td class="p-3 border text-red-500" th:text="${pkg.discountPercent} + '%'"></td>
                    <td class="p-3 border text-green-600 font-semibold" th:text="'$' + ${#numbers.formatDecimal(pkg.discountedPrice,1,2)}"></td>
                    <td class="p-3 border text-gray-500" th:text="${pkg.description}"></td>
                    <td class="p-3 border">
                        <div class="flex gap-2">
                            <a th:href="@{/admin/packages/edit/{id}(id=${pkg.id})}">
                                <button class="bg-yellow-400 hover:bg-yellow-500 text-white px-3 py-1 rounded text-xs font-semibold">Edit</button>
                            </a>
                            <form th:action="@{/admin/packages/delete/{id}(id=${pkg.id})}" method="post" onsubmit="return confirm('Delete this package?')">
                                <button class="bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded text-xs font-semibold">Delete</button>
                            </form>
                        </div>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(packages)}">
                    <td colspan="8" class="p-4 text-center text-gray-400">No packages yet</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>
</body>
</html>
