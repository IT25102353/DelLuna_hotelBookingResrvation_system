<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manage Admins</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6">
<div class="max-w-4xl mx-auto">

    <div class="flex items-center justify-between mb-6">
        <h1 class="text-2xl font-bold text-gray-800">👤 Admin Accounts</h1>
        <a th:href="@{/admin/dashboard}">
            <button class="border border-gray-400 hover:bg-gray-200 px-4 py-2 rounded text-sm">← Dashboard</button>
        </a>
    </div>

    <div th:if="${error}" class="bg-red-100 text-red-700 px-4 py-3 rounded mb-4" th:text="${error}"></div>

    <div class="bg-white rounded-lg shadow p-6 mb-8">
        <h2 class="text-lg font-bold mb-4 text-gray-700">Add New Admin</h2>
        <form th:action="@{/admin/admin/save}" th:object="${newAdmin}" method="post" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block mb-1 font-medium text-sm">Username</label>
                <input type="text" th:field="*{username}" required class="w-full border px-3 py-2 rounded focus:outline-none focus:ring-2 focus:ring-gray-400" placeholder="Enter username"/>
            </div>
            <div>
                <label class="block mb-1 font-medium text-sm">Password</label>
                <input type="password" th:field="*{password}" required class="w-full border px-3 py-2 rounded focus:outline-none focus:ring-2 focus:ring-gray-400" placeholder="Enter password"/>
            </div>
            <div class="md:col-span-2">
                <button type="submit" class="bg-gray-700 hover:bg-gray-800 text-white px-6 py-2 rounded font-semibold">+ Add Admin</button>
            </div>
        </form>
    </div>

    <div class="bg-white rounded-lg shadow p-6">
        <h2 class="text-lg font-bold mb-4 text-gray-700">All Admins</h2>
        <table class="w-full text-left border-collapse text-sm">
            <thead>
            <tr class="bg-gray-100">
                <th class="p-3 border">#</th>
                <th class="p-3 border">Username</th>
                <th class="p-3 border">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="a : ${admins}" class="hover:bg-gray-50">
                <td class="p-3 border" th:text="${a.id}"></td>
                <td class="p-3 border font-medium" th:text="${a.username}"></td>
                <td class="p-3 border">
                    <div class="flex gap-2">
                        <a th:href="@{/admin/admin/edit/{id}(id=${a.id})}">
                            <button class="bg-yellow-400 hover:bg-yellow-500 text-white px-3 py-1 rounded text-xs font-semibold">Edit</button>
                        </a>
                        <form th:action="@{/admin/admin/delete/{id}(id=${a.id})}" method="post" onsubmit="return confirm('Delete this admin account?')">
                            <button class="bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded text-xs font-semibold">Delete</button>
                        </form>
                    </div>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(admins)}">
                <td colspan="3" class="p-4 text-center text-gray-400">No admins found</td>
            </tr>
            </tbody>
        </table>
    </div>

</div>
</body>
</html>
