<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Package</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" th:href="@{/css/hotel-ui.css}">
</head>
<body class="hotel-bg">
<main class="page-shell flex items-center justify-center">
    <section class="glass-panel w-full max-w-3xl rounded-2xl p-5 sm:p-8">
        <div class="mb-6 flex flex-col justify-between gap-4 sm:flex-row sm:items-end">
            <div>
                <span class="step-pill">Step 1 of 2</span>
                <h1 class="mt-3 text-3xl font-extrabold text-slate-900">Choose a Package</h1>
                <p class="mt-2 text-slate-500">Select the stay package that fits your visit.</p>
            </div>
            <div class="rounded-full bg-white px-4 py-2 text-sm font-semibold text-slate-600 shadow-sm" th:text="${'Signed in as ' + session.customerName}"></div>
        </div>

        <form th:action="@{/bookings/select-room}" method="get" class="space-y-4">
            <label th:each="pkg : ${packages}" class="radio-card block cursor-pointer bg-white p-4">
                <input type="radio" name="packageId" th:value="${pkg.id}" required class="peer sr-only">
                <div class="flex flex-col gap-4 sm:flex-row">
                    <img th:if="${pkg.imageUrl}" th:src="@{${pkg.imageUrl}}" alt="Package image" class="h-36 w-full rounded-xl object-cover sm:h-28 sm:w-36">
                    <div class="min-w-0 flex-1">
                        <div class="flex items-start justify-between gap-3">
                            <div>
                                <p class="text-xl font-extrabold text-slate-900" th:text="${pkg.name}"></p>
                                <p class="mt-1 text-sm leading-6 text-slate-500" th:text="${pkg.description}"></p>
                            </div>
                            <span th:if="${pkg.discountPercent > 0}"
                                  class="shrink-0 rounded-full bg-rose-100 px-3 py-1 text-xs font-extrabold text-rose-700"
                                  th:text="${pkg.discountPercent} + '% OFF'"></span>
                        </div>
                        <div class="mt-4 flex items-center justify-between gap-3">
                            <div class="flex items-center gap-3">
                <span th:if="${pkg.discountPercent > 0}"
                      class="text-sm font-semibold text-slate-400 line-through"
                      th:text="'$' + ${#numbers.formatDecimal(pkg.price,1,2)}"></span>
                                <span class="text-2xl font-extrabold text-blue-700"
                                      th:text="'$' + ${#numbers.formatDecimal(pkg.discountedPrice,1,2)}"></span>
                            </div>
                            <span class="select-indicator rounded-full border border-slate-200 px-3 py-1 text-xs font-bold text-slate-500">Select</span>
                        </div>
                    </div>
                </div>
            </label>

            <div th:if="${#lists.isEmpty(packages)}" class="soft-card rounded-2xl p-8 text-center text-slate-500">
                No packages available at the moment.
            </div>

            <div class="flex flex-col gap-3 pt-2 sm:flex-row">
                <button type="submit" class="primary-btn flex-1">Next: Select Room</button>
                <a th:href="@{/}" class="secondary-btn flex-1">Back to Home</a>
            </div>
            <a th:href="@{/customers/logout}" class="block text-center text-sm font-semibold text-slate-500 hover:text-slate-800">Logout</a>
        </form>
    </section>
</main>
</body>
</html>
